<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anarah | Home</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Alleen homepage-fix */
        html,
        body {
            min-height: 100%;
        }

        body.homepage {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        body.homepage nav {
            flex-shrink: 0;
            position: relative;
            z-index: 9999;
        }

        body.homepage nav ul {
            z-index: 9999;
        }

        body.homepage main.homepage-grid {
            flex: 1;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px 50px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        body.homepage .homepage-logo {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body.homepage .homepage-logo img {
            display: block;
            max-width: 340px;
            width: 70%;
            height: auto;
            margin: 0 auto;
        }

        body.homepage .homepage-tagline {
            margin-top: 24px;
            text-align: center;
            color: #a68900;
        }

        body.homepage footer {
            position: relative !important;
            inset: auto !important;
            transform: none !important;

            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 22px 18px;
            margin: 0;

            z-index: 1;
            color: #a68900 !important;
        }

        body.homepage .footer-links {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
            text-align: center;
        }

        body.homepage .footer-links a,
        body.homepage .footer-ig-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            color: #a68900 !important;
        }

        body.homepage .footer-links a:hover,
        body.homepage .footer-ig-link:hover {
            color: #d7b55b !important;
        }

        body.homepage .footer-copy {
            width: 100%;
            margin-top: 10px;
            text-align: center;
            color: #a68900 !important;
        }

        @media (max-width: 768px) {
            body.homepage {
                min-height: 100svh;
            }

            body.homepage nav {
                position: relative;
                z-index: 9999;
            }

            body.homepage nav ul {
                position: relative;
                z-index: 9999;
            }

            body.homepage main.homepage-grid {
                padding: 35px 18px 28px;
                justify-content: center;
                z-index: 1;
            }

            body.homepage .homepage-logo img {
                max-width: 250px;
                width: 72%;
            }

            body.homepage .homepage-tagline {
                margin-top: 18px;
                font-size: 0.95rem;
            }

            body.homepage footer {
                width: 100%;
                padding: 18px 16px 22px;
                z-index: 1;
            }

            body.homepage .footer-links {
                gap: 14px;
                row-gap: 8px;
            }
        }

        @media (max-width: 420px) {
            body.homepage main.homepage-grid {
                padding: 25px 16px 22px;
            }

            body.homepage .homepage-logo img {
                max-width: 215px;
                width: 70%;
            }

            body.homepage .homepage-tagline {
                font-size: 0.85rem;
            }

            body.homepage footer {
                padding: 16px 14px 20px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body class="homepage">

    <nav>
        <a href="index.html" class="logo">ANARAH</a>

        <button class="nav-toggle" aria-expanded="false" aria-label="Open menu">
            <span></span>
        </button>

        <ul>
            <li><a href="html/about.html">About</a></li>
            <li><a href="html/reiki.html">Reiki</a></li>
            <li><a href="html/somatic-dance.html">Somatic Dance</a></li>
            <li><a href="html/events.html">Events</a></li>
            <li><a href="html/experiences.html">Stories</a></li>
            <li><a href="html/contact.html">Contact</a></li>
        </ul>
    </nav>

    <main class="homepage-grid">
        <div class="homepage-logo">
            <img src="images/logo1.png" alt="ANARAH logo">
        </div>

        <div class="homepage-tagline">
            Reiki &amp; Somatic Dance
        </div>

        <div class="homepage-actions" aria-label="Choose an ANARAH experience">
            <a href="html/contact.html" class="btn-action">Book Reiki</a>
            <a href="html/somatic-dance.html" class="btn-action btn-action--secondary">Join a dance</a>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="html/privacy.html">Privacy</a>
            <a href="html/contact.html">Contact</a>

            <a href="https://www.instagram.com/anarah_88"
               target="_blank"
               rel="noopener noreferrer"
               class="footer-ig-link">

                <svg aria-hidden="true"
                     viewBox="0 0 24 24"
                     width="18"
                     height="18"
                     fill="currentColor"
                     xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 7.25a4.75 4.75 0 1 0 0 9.5 4.75 4.75 0 0 0 0-9.5Z"/>
                    <path d="M17.5 5.5h-11A3.5 3.5 0 0 0 3 9v6a3.5 3.5 0 0 0 3.5 3.5h11A3.5 3.5 0 0 0 21 15V9a3.5 3.5 0 0 0-3.5-3.5Zm2.5 8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 13V9a2.5 2.5 0 0 1 2.5-2.5h11A2.5 2.5 0 0 1 20 9v4Zm-3.75-6a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5Z"/>
                </svg>

                Instagram
            </a>
        </div>

        <div class="footer-copy">
            &copy; 2026 ANARAH
        </div>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
